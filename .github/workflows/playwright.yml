name: Playwright Tests (CI & Scheduled Sharding)

on:
  # 1. Kích hoạt khi tạo PR hoặc đẩy thêm commit vào PR trỏ về nhánh main
  pull_request:
    branches: [ main ]

  # 2. Kích hoạt khi merge code trực tiếp vào nhánh main
  push:
    branches: [ main ]

  # 3. Kích hoạt tự động lúc 12:00 trưa giờ Việt Nam (UTC+7) = 05:00 UTC hàng ngày
  schedule:
    - cron: '0 5 * * *'

  # 4. Cho phép kích hoạt thủ công bất kỳ lúc nào từ tab Actions trên GitHub
  workflow_dispatch:

# Tự động hủy lần chạy cũ nếu có commit mới được đẩy lên cùng một PR (tiết kiệm tài nguyên CI)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 shard fail không làm hủy 3 shard còn lại
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Cài đặt Google Chrome & Thư viện hệ thống
        # Dự án cấu hình channel: 'chrome' trong playwright.config.mjs
        run: npx playwright install --with-deps chrome

      - name: Chạy Playwright Tests (Headless + Sharding)
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Lưu trữ Allure Results của Shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 2

  merge-reports:
    name: Merge Allure Reports (Gộp 4 Shards)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Cài đặt Java (Cần thiết cho Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Tải về Allure Results từ cả 4 Shards
        uses: actions/download-artifact@v4
        with:
          path: all-allure-results
          pattern: allure-results-shard-*
          merge-multiple: true

      - name: Tạo Báo Cáo Allure Tổng Hợp Đã Gộp
        run: npx allure generate all-allure-results --clean -o combined-allure-report

      - name: Xuất bản Báo Cáo Tổng Hợp Duy Nhất (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: combined-allure-report/
          retention-days: 14
