name: Playwright Tests (CI & Scheduled Sharding)

on:
  # 1. Kích hoạt khi tạo PR hoặc đẩy thêm commit vào PR trỏ về nhánh main
  pull_request:
    branches: [ main ]

  # 2. Kích hoạt khi merge code trực tiếp vào nhánh main
  push:
    branches: [ main ]

  # 3. Kích hoạt tự động lúc 12:00 trưa giờ Việt Nam (UTC+7) = 05:00 UTC hàng ngày
  schedule:
    - cron: '*/15 * * * *'

  # 4. Cho phép kích hoạt thủ công bất kỳ lúc nào từ tab Actions trên GitHub
  workflow_dispatch:

# Tự động hủy lần chạy cũ nếu có commit mới được đẩy lên cùng một PR (tiết kiệm tài nguyên CI)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cấp quyền xuất bản web lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 shard fail không làm hủy 3 shard còn lại
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Cài đặt Google Chrome & Thư viện hệ thống
        run: npx playwright install --with-deps chrome

      - name: Chạy Playwright Tests (Headless + Sharding)
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Lưu trữ Allure Results của Shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 2

  merge-and-deploy:
    name: Merge & Deploy Allure Report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Cài đặt Java (Cần thiết cho Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Tải về Allure Results từ cả 4 Shards
        uses: actions/download-artifact@v4
        with:
          path: all-allure-results
          pattern: allure-results-shard-*
          merge-multiple: true

      - name: Tạo Báo Cáo Allure Tổng Hợp Đã Gộp
        run: npx allure generate all-allure-results --clean -o combined-allure-report

      - name: Lưu trữ Báo Cáo Artifact (Dự phòng tải zip)
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: combined-allure-report/
          retention-days: 14

      # Xuất bản trực tiếp lên GitHub Pages (Xem online không cần tải zip)
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói trang web Allure Report
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-allure-report/

      - name: Triển khai trực tiếp lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Đính kèm Link Báo Cáo Trực Tuyến vào GitHub Summary
        run: |
          echo "## 📊 Báo Cáo Kiểm Thử Allure Report Trực Tuyến" >> $GITHUB_STEP_SUMMARY
          echo "Toàn bộ 103 test cases từ 4 Shards đã được gộp thành công và xuất bản lên GitHub Pages:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Bấm vào đây để xem trực tiếp Allure Report trên Web](https://dang-nhut-tan.github.io/VivaTest/)**" >> $GITHUB_STEP_SUMMARY
