name: Playwright Tests (Scheduled & Sharded)

on:
  schedule:
    # 12:00 trưa giờ Việt Nam (UTC+7) = 05:00 UTC hàng ngày
    - cron: '0 5 * * *'
  # Cho phép kích hoạt thủ công từ giao diện GitHub Actions (Actions -> Run workflow)
  workflow_dispatch:

jobs:
  test:
    name: Run Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 shard fail không làm hủy 3 shard còn lại
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Cài đặt Google Chrome & Thư viện hệ thống
        # Dự án cấu hình channel: 'chrome' trong playwright.config.mjs
        run: npx playwright install --with-deps chrome

      - name: Chạy Playwright Tests (Headless + Sharding)
        # Mặc định Playwright chạy headless trên CI (và config đã bật headless: true)
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Lưu trữ kết quả test từng Shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: |
            allure-results/
            e2e-report/
          retention-days: 7
